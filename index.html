<!doctype html>
<!--
  Lili Projector: trace an image onto paper with the iPhone camera.
  Rear camera fills the screen; a photo from your library sits on top as a
  semi-transparent overlay you can drag, pinch, rotate, flip and lock.
  One file, no dependencies, no network after load. Hosted on GitHub Pages.
  Target: Safari on iOS (tab or Add to Home Screen).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Lili Projector">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090a">
<title>Lili Projector</title>
<style>
  /* Look loosely modelled on Linear: dark glass surfaces, hairline borders, indigo accent. */
  :root {
    --surface: rgba(24, 25, 28, 0.78);
    --surface-hover: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f7f8f8;
    --text-muted: #8a8f98;
    --accent: #5e6ad2;
    --radius: 8px;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #08090a;
    color: var(--text);
    font: 500 13px/1.4 -apple-system, system-ui, sans-serif;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  button {
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
  }
  .surface {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    backdrop-filter: blur(20px) saturate(1.4);
  }
  video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 32px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(94, 106, 210, 0.18), transparent 60%);
  }
  #start h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  #start p {
    margin: 0 0 16px;
    color: var(--text-muted);
  }
  #startButton {
    min-height: 44px;
    padding: 0 20px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: var(--radius);
    background: var(--accent);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    font-size: 14px;
  }
  #startButton:active { filter: brightness(1.1); }
  #message {
    max-width: 320px;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: var(--radius);
    color: var(--text-muted);
    text-align: left;
  }
  #message:empty { display: none; }
  #layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #toolbar {
    position: fixed;
    left: calc(env(safe-area-inset-left) + 8px);
    right: calc(env(safe-area-inset-right) + 8px);
    bottom: calc(env(safe-area-inset-bottom) + 8px);
    padding: 4px 8px 8px;
    border-radius: 12px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
    color: var(--text-muted);
  }
  #opacityValue {
    min-width: 36px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #opacity {
    --p: 50%;
    flex: 1;
    height: 44px;
    margin: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
  }
  #opacity::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p), rgba(255, 255, 255, 0.12) var(--p));
  }
  #opacity::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }
  #toolbar .buttons {
    display: flex;
    gap: 4px;
  }
  #toolbar button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 52px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: transparent;
    color: #d0d6e0;
    font-size: 11px;
  }
  #toolbar button:active:not(:disabled) {
    background: var(--surface-hover);
    border-color: var(--border);
  }
  #toolbar svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #toolbar button:disabled, #opacity:disabled { opacity: 0.35; }
  #version {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 4px);
    right: calc(env(safe-area-inset-right) + 4px);
    padding: 12px 10px;
    color: rgba(255, 255, 255, 0.75);
    font: 11px ui-monospace, SFMono-Regular, monospace;
    text-shadow: 0 0 2px #000, 0 0 6px #000;
  }
  #version.pressing { color: var(--text); }
  #debug {
    position: fixed;
    left: calc(env(safe-area-inset-left) + 8px);
    right: calc(env(safe-area-inset-right) + 8px);
    top: calc(env(safe-area-inset-top) + 96px);
    padding: 10px 12px;
    border-radius: var(--radius);
    font: 11px/1.5 ui-monospace, SFMono-Regular, monospace;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #unlock {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 4px);
    left: calc(env(safe-area-inset-left) + 8px);
    display: flex;
    align-items: center;
    gap: 6px;
    height: 44px;
    padding: 0 14px;
    overflow: hidden;
    border-radius: 22px;
  }
  #unlock svg {
    position: relative;
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
  }
  #unlock span { position: relative; }
  /* Fills left to right over the 600 ms hold so you can see the unlock coming. */
  #unlock::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.15s;
  }
  #unlock.pressing::before {
    transform: scaleX(1);
    transition: transform 0.6s linear;
  }
  #notice {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 56px);
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 8px 12px;
    border-radius: var(--radius);
    color: #e5c07b;
    font-size: 12px;
    text-align: center;
  }
  #notice:empty { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div id="layer" hidden><canvas id="overlay"></canvas></div>
<div id="toolbar" class="surface" hidden>
  <div class="slider-row">
    <span>Opacity</span>
    <input id="opacity" type="range" min="0.05" max="1" step="0.01" value="0.5" aria-label="Opacity" disabled>
    <span id="opacityValue">50%</span>
  </div>
  <div class="buttons">
    <button id="flip" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 3v18M8 7 3 17h5zM16 7l5 10h-5z"/></svg>Flip
    </button>
    <button id="reset" disabled>
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Reset
    </button>
    <button id="pick">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-5-9 9"/></svg>Image
    </button>
    <button id="lock" disabled>
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Lock
    </button>
    <button id="snap">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Snap
    </button>
  </div>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="start">
  <h1>Lili Projector</h1>
  <p>Trace any image onto paper.</p>
  <button id="startButton">Start camera</button>
  <div id="message" class="surface"></div>
</div>
<button id="unlock" class="surface" hidden>
  <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Hold to unlock</span>
</button>
<div id="notice" class="surface"></div>
<div id="version">v1.0.0</div>
<div id="debug" class="surface" hidden></div>
<script>
const video = document.getElementById("video");
const startScreen = document.getElementById("start");
const message = document.getElementById("message");
const versionEl = document.getElementById("version");
const debugEl = document.getElementById("debug");

let stream = null;
let wantCamera = false;
let starting = false;

async function startCamera() {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    message.textContent = "Camera needs a secure (HTTPS) page. Open the GitHub Pages URL.";
    return;
  }
  if (starting) return;
  starting = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false,
    });
  } catch (err) {
    starting = false;
    wantCamera = false;
    startScreen.hidden = false;
    if (err.name === "NotAllowedError") {
      message.textContent = "Camera permission denied. Allow it in Settings > Apps > Safari > Camera, or tap aA in the address bar > Website Settings, then reload.";
    } else if (err.name === "NotFoundError" || err.name === "OverconstrainedError") {
      message.textContent = "No camera found.";
    } else {
      message.textContent = "Camera error: " + err.name + " " + err.message;
    }
    return;
  }
  starting = false;
  // The page may have been hidden while the permission prompt was open.
  if (!wantCamera || document.hidden) {
    stopCamera();
    return;
  }
  video.srcObject = stream;
  video.play().catch(() => {});
  startScreen.hidden = true;
  toolbar.hidden = false;
  if (!debugEl.hidden) showDebug();
  requestWakeLock();
}

// Safari releases the wake lock whenever the page is hidden, and startCamera
// runs again on return, so this also re-acquires it.
const notice = document.getElementById("notice");
let wakeLock = null;

async function requestWakeLock() {
  if (!("wakeLock" in navigator)) {
    notice.textContent = "Screen wake lock not supported: the screen may dim.";
    return;
  }
  if (wakeLock && !wakeLock.released) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    notice.textContent = "";
  } catch (err) {
    notice.textContent = "Wake lock failed (" + err.name + "): the screen may dim.";
  }
}

function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
}

document.getElementById("startButton").addEventListener("click", () => {
  wantCamera = true;
  message.textContent = "";
  startCamera();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopCamera();
  else if (wantCamera && !stream) startCamera();
});

const layer = document.getElementById("layer");
const overlay = document.getElementById("overlay");
const toolbar = document.getElementById("toolbar");
const opacityInput = document.getElementById("opacity");
const flipButton = document.getElementById("flip");
const resetButton = document.getElementById("reset");
const pickButton = document.getElementById("pick");
const fileInput = document.getElementById("file");
const MAX_SIDE = 2048;
// x, y: viewport position of the image center. rotation in radians.
const state = { x: 0, y: 0, scale: 1, rotation: 0, flipX: false, opacity: 0.5 };

let frameQueued = false;
function applyTransform() {
  frameQueued = false;
  const sx = state.flipX ? -state.scale : state.scale;
  overlay.style.opacity = state.opacity;
  overlay.style.transform =
    `translate(${state.x}px, ${state.y}px) rotate(${state.rotation}rad) ` +
    `scale(${sx}, ${state.scale}) ` +
    `translate(${-overlay.width / 2}px, ${-overlay.height / 2}px)`;
}
function render() {
  if (!frameQueued) {
    frameQueued = true;
    requestAnimationFrame(applyTransform);
  }
}

// Gestures: every time a finger lands or lifts we re-anchor on the current
// fingers and state, so the image never jumps when the finger count changes.
const pointers = new Map();
let anchor = null;
let locked = false;

function reanchor() {
  const pts = [...pointers.values()];
  anchor = { state: { ...state }, pts: pts.slice(0, 2).map((p) => ({ ...p })) };
}

layer.addEventListener("pointerdown", (e) => {
  if (locked) return;
  layer.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  reanchor();
});

layer.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const pts = [...pointers.values()];
  const s0 = anchor.state;
  if (anchor.pts.length === 1) {
    state.x = s0.x + pts[0].x - anchor.pts[0].x;
    state.y = s0.y + pts[0].y - anchor.pts[0].y;
  } else {
    const [a0, b0] = anchor.pts;
    const [a, b] = pts;
    const m0 = { x: (a0.x + b0.x) / 2, y: (a0.y + b0.y) / 2 };
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const d0 = Math.hypot(b0.x - a0.x, b0.y - a0.y) || 1;
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const dAngle = Math.atan2(b.y - a.y, b.x - a.x) - Math.atan2(b0.y - a0.y, b0.x - a0.x);
    state.scale = Math.min(10, Math.max(0.1, s0.scale * d / d0));
    state.rotation = s0.rotation + dAngle;
    // Rotate and scale the old center around the old midpoint, then follow the midpoint.
    const k = state.scale / s0.scale;
    const vx = s0.x - m0.x;
    const vy = s0.y - m0.y;
    const cos = Math.cos(dAngle);
    const sin = Math.sin(dAngle);
    state.x = m.x + k * (vx * cos - vy * sin);
    state.y = m.y + k * (vx * sin + vy * cos);
  }
  render();
});

for (const type of ["pointerup", "pointercancel"]) {
  layer.addEventListener(type, (e) => {
    pointers.delete(e.pointerId);
    reanchor();
  });
}

// Safari's own pinch/rotate gestures would zoom the page.
for (const type of ["gesturestart", "gesturechange", "gestureend"]) {
  document.addEventListener(type, (e) => e.preventDefault());
}

function resetTransform() {
  state.x = window.innerWidth / 2;
  state.y = window.innerHeight / 2;
  state.scale = window.innerWidth / overlay.width;
  state.rotation = 0;
  state.flipX = false;
  render();
}

pickButton.addEventListener("click", () => fileInput.click());
resetButton.addEventListener("click", resetTransform);
flipButton.addEventListener("click", () => {
  state.flipX = !state.flipX;
  render();
});
const opacityValue = document.getElementById("opacityValue");
opacityInput.addEventListener("input", () => {
  state.opacity = Number(opacityInput.value);
  // Linear-style filled track: CSS reads the position from --p.
  const p = (opacityInput.value - opacityInput.min) / (opacityInput.max - opacityInput.min) * 100;
  opacityInput.style.setProperty("--p", p + "%");
  opacityValue.textContent = Math.round(state.opacity * 100) + "%";
  render();
});
opacityInput.dispatchEvent(new Event("input"));

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  try {
    await img.decode();
  } catch {
    URL.revokeObjectURL(url);
    alert("Could not open that image.");
    return;
  }
  // Safari applies EXIF orientation to naturalWidth/Height and to drawImage.
  const ratio = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  overlay.width = Math.round(img.naturalWidth * ratio);
  overlay.height = Math.round(img.naturalHeight * ratio);
  const ctx = overlay.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, overlay.width, overlay.height);
  URL.revokeObjectURL(url);

  resetTransform();
  layer.hidden = false;
  opacityInput.disabled = flipButton.disabled = resetButton.disabled = lockButton.disabled = false;
});

const lockButton = document.getElementById("lock");
const unlockButton = document.getElementById("unlock");

lockButton.addEventListener("click", () => {
  locked = true;
  pointers.clear();
  toolbar.hidden = true;
  unlockButton.hidden = false;
});

// Snapshot: the full camera frame at its native resolution, without the overlay.
document.getElementById("snap").addEventListener("click", () => {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(video, 0, 0, w, h);

  const name = "trace-" + Date.now() + ".png";
  const canShareFiles = !!navigator.canShare &&
    navigator.canShare({ files: [new File([""], name, { type: "image/png" })] });
  // Popups must open during the tap itself, before any await.
  const tab = canShareFiles ? null : window.open("", "_blank");

  canvas.toBlob(async (blob) => {
    if (!blob) {
      notice.textContent = "Snapshot failed.";
      if (tab) tab.close();
      return;
    }
    if (tab) {
      tab.location.href = URL.createObjectURL(blob);
      return;
    }
    try {
      await navigator.share({ files: [new File([blob], name, { type: "image/png" })] });
    } catch (err) {
      if (err.name !== "AbortError") notice.textContent = "Share failed (" + err.name + ").";
    }
  }, "image/png");
});

function onLongPress(el, action) {
  let timer = null;
  el.addEventListener("pointerdown", () => {
    el.classList.add("pressing");
    timer = setTimeout(() => {
      el.classList.remove("pressing");
      action();
    }, 600);
  });
  for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
    el.addEventListener(type, () => {
      el.classList.remove("pressing");
      clearTimeout(timer);
    });
  }
}

onLongPress(unlockButton, () => {
  locked = false;
  unlockButton.hidden = true;
  toolbar.hidden = false;
});

function showDebug() {
  const track = stream && stream.getVideoTracks()[0];
  let caps = "camera not started";
  let torch = "n/a";
  if (track) {
    if (typeof track.getCapabilities === "function") {
      const c = track.getCapabilities();
      caps = Object.keys(c).join(", ");
      torch = "torch" in c ? "yes" : "no";
    } else {
      caps = "getCapabilities not supported";
    }
  }
  debugEl.textContent = [
    "UA: " + navigator.userAgent,
    "mediaDevices: " + ("mediaDevices" in navigator),
    "capabilities: " + caps,
    "torch: " + torch,
    "wakeLock: " + ("wakeLock" in navigator),
  ].join("\n");
}

onLongPress(versionEl, () => {
  debugEl.hidden = !debugEl.hidden;
  if (!debugEl.hidden) showDebug();
});
</script>
</body>
</html>
