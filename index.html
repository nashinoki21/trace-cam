<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace Cam</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    color: #fff;
    font: 14px -apple-system, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 24px;
    text-align: center;
  }
  #start button {
    min-height: 44px;
    padding: 12px 28px;
    border: 0;
    border-radius: 12px;
    background: #fff;
    color: #000;
    font: inherit;
    font-size: 17px;
  }
  #message:empty { display: none; }
  #layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #toolbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px calc(env(safe-area-inset-right) + 12px)
      calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px);
    background: rgba(0, 0, 0, 0.6);
  }
  #opacity {
    display: block;
    width: 100%;
    height: 44px;
    margin: 0;
  }
  #toolbar .buttons {
    display: flex;
    gap: 8px;
  }
  #toolbar button {
    flex: 1;
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.85);
    color: #000;
    font: inherit;
    font-size: 15px;
  }
  #toolbar button:disabled, #opacity:disabled { opacity: 0.4; }
  #version {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 4px);
    right: calc(env(safe-area-inset-right) + 4px);
    padding: 8px;
    opacity: 0.6;
  }
  #debug {
    position: fixed;
    left: calc(env(safe-area-inset-left) + 8px);
    right: calc(env(safe-area-inset-right) + 8px);
    top: calc(env(safe-area-inset-top) + 44px);
    padding: 8px;
    background: rgba(0, 0, 0, 0.7);
    font: 11px ui-monospace, monospace;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #unlock {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 4px);
    left: calc(env(safe-area-inset-left) + 4px);
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 22px;
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    font: inherit;
    font-size: 12px;
    transition: background 0.1s;
  }
  /* Fills over the 600 ms hold so you can see the unlock coming. */
  #unlock.pressing {
    background: rgba(255, 255, 255, 0.9);
    color: #000;
    transition: background 0.6s linear;
  }
  #notice {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 14px);
    left: calc(env(safe-area-inset-left) + 56px);
    right: calc(env(safe-area-inset-right) + 64px);
    font-size: 12px;
    text-align: center;
    text-shadow: 0 0 3px #000;
  }
  #notice:empty { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div id="layer" hidden><canvas id="overlay"></canvas></div>
<div id="toolbar" hidden>
  <input id="opacity" type="range" min="0.05" max="1" step="0.01" value="0.5" aria-label="Opacity" disabled>
  <div class="buttons">
    <button id="flip" disabled>Flip</button>
    <button id="reset" disabled>Reset</button>
    <button id="pick">Image</button>
    <button id="lock" disabled>Lock</button>
  </div>
</div>
<input id="file" type="file" accept="image/*" hidden>
<div id="start">
  <button id="startButton">Start camera</button>
  <div id="message"></div>
</div>
<button id="unlock" hidden aria-label="Hold to unlock">Hold</button>
<div id="notice"></div>
<div id="version">v0.6.0</div>
<div id="debug" hidden></div>
<script>
const video = document.getElementById("video");
const startScreen = document.getElementById("start");
const message = document.getElementById("message");
const versionEl = document.getElementById("version");
const debugEl = document.getElementById("debug");

let stream = null;
let wantCamera = false;
let starting = false;

async function startCamera() {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    message.textContent = "Camera needs a secure (HTTPS) page. Open the GitHub Pages URL.";
    return;
  }
  if (starting) return;
  starting = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false,
    });
  } catch (err) {
    starting = false;
    wantCamera = false;
    startScreen.hidden = false;
    if (err.name === "NotAllowedError") {
      message.textContent = "Camera permission denied. Allow it in Settings > Apps > Safari > Camera, or tap aA in the address bar > Website Settings, then reload.";
    } else if (err.name === "NotFoundError" || err.name === "OverconstrainedError") {
      message.textContent = "No camera found.";
    } else {
      message.textContent = "Camera error: " + err.name + " " + err.message;
    }
    return;
  }
  starting = false;
  // The page may have been hidden while the permission prompt was open.
  if (!wantCamera || document.hidden) {
    stopCamera();
    return;
  }
  video.srcObject = stream;
  video.play().catch(() => {});
  startScreen.hidden = true;
  toolbar.hidden = false;
  if (!debugEl.hidden) showDebug();
  requestWakeLock();
}

// Safari releases the wake lock whenever the page is hidden, and startCamera
// runs again on return, so this also re-acquires it.
const notice = document.getElementById("notice");
let wakeLock = null;

async function requestWakeLock() {
  if (!("wakeLock" in navigator)) {
    notice.textContent = "Screen wake lock not supported: the screen may dim.";
    return;
  }
  if (wakeLock && !wakeLock.released) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    notice.textContent = "";
  } catch (err) {
    notice.textContent = "Wake lock failed (" + err.name + "): the screen may dim.";
  }
}

function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
}

document.getElementById("startButton").addEventListener("click", () => {
  wantCamera = true;
  message.textContent = "";
  startCamera();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopCamera();
  else if (wantCamera && !stream) startCamera();
});

const layer = document.getElementById("layer");
const overlay = document.getElementById("overlay");
const toolbar = document.getElementById("toolbar");
const opacityInput = document.getElementById("opacity");
const flipButton = document.getElementById("flip");
const resetButton = document.getElementById("reset");
const pickButton = document.getElementById("pick");
const fileInput = document.getElementById("file");
const MAX_SIDE = 2048;
// x, y: viewport position of the image center. rotation in radians.
const state = { x: 0, y: 0, scale: 1, rotation: 0, flipX: false, opacity: 0.5 };

let frameQueued = false;
function applyTransform() {
  frameQueued = false;
  const sx = state.flipX ? -state.scale : state.scale;
  overlay.style.opacity = state.opacity;
  overlay.style.transform =
    `translate(${state.x}px, ${state.y}px) rotate(${state.rotation}rad) ` +
    `scale(${sx}, ${state.scale}) ` +
    `translate(${-overlay.width / 2}px, ${-overlay.height / 2}px)`;
}
function render() {
  if (!frameQueued) {
    frameQueued = true;
    requestAnimationFrame(applyTransform);
  }
}

// Gestures: every time a finger lands or lifts we re-anchor on the current
// fingers and state, so the image never jumps when the finger count changes.
const pointers = new Map();
let anchor = null;
let locked = false;

function reanchor() {
  const pts = [...pointers.values()];
  anchor = { state: { ...state }, pts: pts.slice(0, 2).map((p) => ({ ...p })) };
}

layer.addEventListener("pointerdown", (e) => {
  if (locked) return;
  layer.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  reanchor();
});

layer.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const pts = [...pointers.values()];
  const s0 = anchor.state;
  if (anchor.pts.length === 1) {
    state.x = s0.x + pts[0].x - anchor.pts[0].x;
    state.y = s0.y + pts[0].y - anchor.pts[0].y;
  } else {
    const [a0, b0] = anchor.pts;
    const [a, b] = pts;
    const m0 = { x: (a0.x + b0.x) / 2, y: (a0.y + b0.y) / 2 };
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const d0 = Math.hypot(b0.x - a0.x, b0.y - a0.y) || 1;
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const dAngle = Math.atan2(b.y - a.y, b.x - a.x) - Math.atan2(b0.y - a0.y, b0.x - a0.x);
    state.scale = Math.min(10, Math.max(0.1, s0.scale * d / d0));
    state.rotation = s0.rotation + dAngle;
    // Rotate and scale the old center around the old midpoint, then follow the midpoint.
    const k = state.scale / s0.scale;
    const vx = s0.x - m0.x;
    const vy = s0.y - m0.y;
    const cos = Math.cos(dAngle);
    const sin = Math.sin(dAngle);
    state.x = m.x + k * (vx * cos - vy * sin);
    state.y = m.y + k * (vx * sin + vy * cos);
  }
  render();
});

for (const type of ["pointerup", "pointercancel"]) {
  layer.addEventListener(type, (e) => {
    pointers.delete(e.pointerId);
    reanchor();
  });
}

// Safari's own pinch/rotate gestures would zoom the page.
for (const type of ["gesturestart", "gesturechange", "gestureend"]) {
  document.addEventListener(type, (e) => e.preventDefault());
}

function resetTransform() {
  state.x = window.innerWidth / 2;
  state.y = window.innerHeight / 2;
  state.scale = window.innerWidth / overlay.width;
  state.rotation = 0;
  state.flipX = false;
  render();
}

pickButton.addEventListener("click", () => fileInput.click());
resetButton.addEventListener("click", resetTransform);
flipButton.addEventListener("click", () => {
  state.flipX = !state.flipX;
  render();
});
opacityInput.addEventListener("input", () => {
  state.opacity = Number(opacityInput.value);
  render();
});

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  try {
    await img.decode();
  } catch {
    URL.revokeObjectURL(url);
    alert("Could not open that image.");
    return;
  }
  // Safari applies EXIF orientation to naturalWidth/Height and to drawImage.
  const ratio = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  overlay.width = Math.round(img.naturalWidth * ratio);
  overlay.height = Math.round(img.naturalHeight * ratio);
  const ctx = overlay.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, overlay.width, overlay.height);
  URL.revokeObjectURL(url);

  resetTransform();
  layer.hidden = false;
  opacityInput.disabled = flipButton.disabled = resetButton.disabled = lockButton.disabled = false;
});

const lockButton = document.getElementById("lock");
const unlockButton = document.getElementById("unlock");

lockButton.addEventListener("click", () => {
  locked = true;
  pointers.clear();
  toolbar.hidden = true;
  unlockButton.hidden = false;
});

function onLongPress(el, action) {
  let timer = null;
  el.addEventListener("pointerdown", () => {
    el.classList.add("pressing");
    timer = setTimeout(() => {
      el.classList.remove("pressing");
      action();
    }, 600);
  });
  for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
    el.addEventListener(type, () => {
      el.classList.remove("pressing");
      clearTimeout(timer);
    });
  }
}

onLongPress(unlockButton, () => {
  locked = false;
  unlockButton.hidden = true;
  toolbar.hidden = false;
});

function showDebug() {
  const track = stream && stream.getVideoTracks()[0];
  let caps = "camera not started";
  let torch = "n/a";
  if (track) {
    if (typeof track.getCapabilities === "function") {
      const c = track.getCapabilities();
      caps = Object.keys(c).join(", ");
      torch = "torch" in c ? "yes" : "no";
    } else {
      caps = "getCapabilities not supported";
    }
  }
  debugEl.textContent = [
    "UA: " + navigator.userAgent,
    "mediaDevices: " + ("mediaDevices" in navigator),
    "capabilities: " + caps,
    "torch: " + torch,
    "wakeLock: " + ("wakeLock" in navigator),
  ].join("\n");
}

onLongPress(versionEl, () => {
  debugEl.hidden = !debugEl.hidden;
  if (!debugEl.hidden) showDebug();
});
</script>
</body>
</html>
