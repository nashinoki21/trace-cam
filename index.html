<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace Cam</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    color: #fff;
    font: 14px -apple-system, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 0 24px;
    text-align: center;
  }
  #start button {
    min-height: 44px;
    padding: 12px 28px;
    border: 0;
    border-radius: 12px;
    background: #fff;
    color: #000;
    font: inherit;
    font-size: 17px;
  }
  #message:empty { display: none; }
  #overlay {
    position: fixed;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    pointer-events: none;
  }
  #pick {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 16px);
    transform: translateX(-50%);
    min-height: 44px;
    padding: 12px 24px;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.85);
    color: #000;
    font: inherit;
    font-size: 17px;
  }
  #version {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 4px);
    right: calc(env(safe-area-inset-right) + 4px);
    padding: 8px;
    opacity: 0.6;
  }
  #debug {
    position: fixed;
    left: calc(env(safe-area-inset-left) + 8px);
    right: calc(env(safe-area-inset-right) + 8px);
    bottom: calc(env(safe-area-inset-bottom) + 8px);
    padding: 8px;
    background: rgba(0, 0, 0, 0.7);
    font: 11px ui-monospace, monospace;
    white-space: pre-wrap;
    word-break: break-all;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="overlay" hidden></canvas>
<button id="pick" hidden>Choose image</button>
<input id="file" type="file" accept="image/*" hidden>
<div id="start">
  <button id="startButton">Start camera</button>
  <div id="message"></div>
</div>
<div id="version">v0.2.0</div>
<div id="debug" hidden></div>
<script>
const video = document.getElementById("video");
const startScreen = document.getElementById("start");
const message = document.getElementById("message");
const versionEl = document.getElementById("version");
const debugEl = document.getElementById("debug");

let stream = null;
let wantCamera = false;
let starting = false;

async function startCamera() {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    message.textContent = "Camera needs a secure (HTTPS) page. Open the GitHub Pages URL.";
    return;
  }
  if (starting) return;
  starting = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false,
    });
  } catch (err) {
    starting = false;
    wantCamera = false;
    startScreen.hidden = false;
    if (err.name === "NotAllowedError") {
      message.textContent = "Camera permission denied. Allow it in Settings > Apps > Safari > Camera, or tap aA in the address bar > Website Settings, then reload.";
    } else if (err.name === "NotFoundError" || err.name === "OverconstrainedError") {
      message.textContent = "No camera found.";
    } else {
      message.textContent = "Camera error: " + err.name + " " + err.message;
    }
    return;
  }
  starting = false;
  // The page may have been hidden while the permission prompt was open.
  if (!wantCamera || document.hidden) {
    stopCamera();
    return;
  }
  video.srcObject = stream;
  video.play().catch(() => {});
  startScreen.hidden = true;
  pickButton.hidden = false;
  if (!debugEl.hidden) showDebug();
}

function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
}

document.getElementById("startButton").addEventListener("click", () => {
  wantCamera = true;
  message.textContent = "";
  startCamera();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopCamera();
  else if (wantCamera && !stream) startCamera();
});

const overlay = document.getElementById("overlay");
const pickButton = document.getElementById("pick");
const fileInput = document.getElementById("file");
const MAX_SIDE = 2048;
// x, y: viewport position of the image center.
const state = { x: 0, y: 0, scale: 1, opacity: 0.5 };

function applyTransform() {
  overlay.style.opacity = state.opacity;
  overlay.style.transform =
    `translate(${state.x}px, ${state.y}px) scale(${state.scale}) ` +
    `translate(${-overlay.width / 2}px, ${-overlay.height / 2}px)`;
}

pickButton.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  try {
    await img.decode();
  } catch {
    URL.revokeObjectURL(url);
    alert("Could not open that image.");
    return;
  }
  // Safari applies EXIF orientation to naturalWidth/Height and to drawImage.
  const ratio = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  overlay.width = Math.round(img.naturalWidth * ratio);
  overlay.height = Math.round(img.naturalHeight * ratio);
  const ctx = overlay.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, overlay.width, overlay.height);
  URL.revokeObjectURL(url);

  state.x = window.innerWidth / 2;
  state.y = window.innerHeight / 2;
  state.scale = window.innerWidth / overlay.width;
  applyTransform();
  overlay.hidden = false;
});

function showDebug() {
  const track = stream && stream.getVideoTracks()[0];
  let caps = "camera not started";
  let torch = "n/a";
  if (track) {
    if (typeof track.getCapabilities === "function") {
      const c = track.getCapabilities();
      caps = Object.keys(c).join(", ");
      torch = "torch" in c ? "yes" : "no";
    } else {
      caps = "getCapabilities not supported";
    }
  }
  debugEl.textContent = [
    "UA: " + navigator.userAgent,
    "mediaDevices: " + ("mediaDevices" in navigator),
    "capabilities: " + caps,
    "torch: " + torch,
    "wakeLock: " + ("wakeLock" in navigator),
  ].join("\n");
}

let pressTimer = null;
versionEl.addEventListener("pointerdown", () => {
  pressTimer = setTimeout(() => {
    debugEl.hidden = !debugEl.hidden;
    if (!debugEl.hidden) showDebug();
  }, 600);
});
for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
  versionEl.addEventListener(type, () => clearTimeout(pressTimer));
}
</script>
</body>
</html>
